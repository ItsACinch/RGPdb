[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rgdb-embeddings"
version = "0.1.0"
description = "Train embeddings for RGDB graph database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "RGDB Team" }
]
keywords = ["embeddings", "graph-database", "rag", "knowledge-graph", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "click>=8.0",
    "tqdm>=4.65",
    "PyPDF2>=3.0",
    "tiktoken>=0.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
gnn = [
    "torch-geometric>=2.3",
]
all = [
    "rgdb-embeddings[dev,gnn]",
]

[project.scripts]
rgdb-embed = "rgdb_embeddings.cli:cli"

[project.urls]
Homepage = "https://github.com/rgdb/rgdb-embeddings"
Documentation = "https://github.com/rgdb/rgdb-embeddings#readme"
Repository = "https://github.com/rgdb/rgdb-embeddings"

[tool.hatch.build.targets.wheel]
packages = ["src/rgdb_embeddings"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
