[package]
name = "rgdb"
version = "0.1.0"
edition = "2021"

[lib]
name = "rgdb"
path = "src/lib.rs"

[[bin]]
name = "rgdb"
path = "src/main.rs"

[dependencies]
# Graph partitioning - testing multiple options
petgraph = "0.6"
hashbrown = "0.14"

# Binary I/O
memmap2 = "0.9"
byteorder = "1.5"
bincode = "1.3"
thiserror = "1.0"

# Vector similarity
ndarray = "0.16"

# LLM support
llm-chain = "0.4"

# CUDA support
rustacuda = "0.1"
rustacuda_core = "0.1"

[dev-dependencies]
criterion = "0.5"

