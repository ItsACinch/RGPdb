name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rgdb:
    name: build + test (rgdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p rgdb --verbose
      - name: Test
        run: cargo test -p rgdb --verbose
